<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10233a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro de OT">
<title>Registro de OT</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{--bg:#edf0f3;--card:#fff;--tx:#10233a;--mu:#5f7080;--bd:#d5dce3;--ac:#f2a900;--acx:#10233a;--dg:#b42318;--chip:#e3e9ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c141c;--card:#15212d;--tx:#eaf0f5;--mu:#93a4b3;--bd:#27384a;--ac:#f2a900;--acx:#10233a;--dg:#f97066;--chip:#1f3042}}
:root[data-theme="dark"]{--bg:#0c141c;--card:#15212d;--tx:#eaf0f5;--mu:#93a4b3;--bd:#27384a;--ac:#f2a900;--acx:#10233a;--dg:#f97066;--chip:#1f3042}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:16px}
.pie{max-width:520px;margin:0 auto;padding:4px 16px 28px;text-align:center;font-size:11px;color:var(--mu);user-select:none;-webkit-user-select:none}
h1{font-size:22px;margin:4px 0 2px}
.mu{color:var(--mu);font-size:14px;margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-top:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
textarea{min-height:70px;resize:vertical}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font-weight:700}
.btn2{padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);flex:1}
.wa{background:#1fa855;color:#fff;border-color:#1fa855;font-weight:700}
.row{display:flex;gap:8px;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.lnk{background:none;border:0;color:var(--mu);text-decoration:underline;font-size:14px;padding:12px 6px;min-height:44px}
.mes{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.mes button{width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:20px}
.mes b{font-size:18px;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.tot{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.it:first-child{border-top:0}
.it .o{font-weight:700;font-variant-numeric:tabular-nums}
.it .t{flex:1;color:var(--mu);font-size:14px}
.x{border:0;background:none;color:var(--mu);font-size:13px;padding:8px}
.x.p{color:var(--dg);font-weight:700}
.err{color:var(--dg);font-size:13px;margin-top:6px;min-height:16px}
.vacio{color:var(--mu);text-align:center;padding:14px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pie">Editor: Boris Casanueva Muñoz</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
var TIPOS=["2P","3P","3P 1D","3P 2D","3P 3D","ADTV1","ADTV2","ADTV3","Inst.AP","Rec. Excep.","Delivery CR","ViTec","ViMud","Adecuación","Liberación DP","Liberación DP Recup","Adecuación CTO"];
var K="registro_ot_v1",S={user:null,regs:[]},editing=false,pend=null,lastTipo=TIPOS[0],err="";
try{var raw=localStorage.getItem(K);if(raw)S=JSON.parse(raw)}catch(e){}
var BASE=TIPOS.slice(),addingTipo=false,otTmp="";
if(!Array.isArray(S.extra))S.extra=[];
S.extra.forEach(function(t){if(TIPOS.indexOf(t)<0)TIPOS.push(t)});
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,"0")}
function hoy(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
var mes=hoy().slice(0,7);
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function mesLabel(m){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleDateString("es",{month:"long",year:"numeric"})}
function fdia(f){var p=f.split("-");return p[2]+"/"+p[1]}
function del(){}
function render(){
 var A=document.getElementById("app");
 if(!S.user||editing){
  var u=S.user||{n:"",a:""};
  A.innerHTML='<h1>Registro de OT</h1><p class="mu">Ingresa tu nombre para personalizar la app.</p><div class="card"><label for="n">Nombre</label><input id="n" value="'+esc(u.n)+'" autocomplete="given-name"><label for="a">Apellido</label><input id="a" value="'+esc(u.a)+'" autocomplete="family-name"><div class="err" id="e"></div><button class="btn" onclick="setUser()">Guardar y continuar</button>'+(S.user?'<button class="btn2" style="width:100%;margin-top:8px" onclick="cancelarNombre()">Cancelar</button>':"")+'</div>';
  return;
 }
 if(vista==="hist"){renderHist();return}
 var rs=S.regs.filter(function(r){return r.fecha.indexOf(mes)===0}).sort(function(a,b){return b.id-a.id});
 var cnt={};rs.forEach(function(r){cnt[r.tipo]=(cnt[r.tipo]||0)+1});
 var opts=TIPOS.map(function(t){return'<option'+(t===lastTipo?" selected":"")+'>'+esc(t)+'</option>'}).join("");
 var chips=TIPOS.filter(function(t){return cnt[t]}).map(function(t){return'<span class="chip">'+esc(t)+' <b>'+cnt[t]+'</b></span>'}).join("");
 var lista=rs.length?rs.map(function(r){return'<div class="it"><span class="o">'+esc(r.ot)+'</span><span class="t">'+esc(r.tipo)+' · '+fdia(r.fecha)+'</span><button class="x'+(pend===r.id?" p":"")+'" onclick="borrar('+r.id+')">'+(pend===r.id?"¿Seguro?":"Borrar")+'</button></div>'}).join(""):'<div class="vacio">Sin registros este mes. Carga la primera OT arriba.</div>';
 A_html=
  '<div class="top"><div><h1>Hola, '+esc(S.user.n)+'</h1><p class="mu">'+esc(S.user.n+" "+S.user.a)+'</p></div><button class="lnk" onclick="editarNombre()">Cambiar nombre</button></div>'+
  '<div class="card"><label for="ot">Número de OT</label><input id="ot" inputmode="numeric" pattern="[0-9]*" oninput="soloNum(this)" autocomplete="off" placeholder="Ej: 123456" value="'+esc(otTmp)+'"><label for="tipo">Tipo</label><select id="tipo" onchange="lastTipo=this.value">'+opts+'</select>'+tipoUI()+'<div class="err">'+esc(err)+'</div><button class="btn" onclick="add()">Guardar OT</button></div>'+
  '<div class="mes"><button aria-label="Mes anterior" onclick="cm(-1)">‹</button><b>'+esc(mesLabel(mes))+'</b><button aria-label="Mes siguiente" onclick="cm(1)">›</button></div>'+
  '<div class="card"><div class="tot">'+rs.length+'</div><p class="mu">OT en el mes</p><div class="chips">'+chips+'</div><div class="row"><button class="btn2 wa" onclick="wa()">Enviar por WhatsApp</button><button class="btn2" onclick="copiar()">Copiar</button></div><div class="row"><button class="btn2" onclick="pdfMes()">PDF del mes</button><button class="btn2" onclick="irHist()">Historial por tipo</button></div></div>'+
  '<div class="card">'+lista+'</div>'+
  '<div class="card"><b>Copia de seguridad</b><p class="mu">'+(S.bk?"Última copia: "+fdia(S.bk)+" ("+S.bk.slice(0,4)+")":"Aún no has hecho una copia.")+'</p><p class="mu">Guarda el código en WhatsApp o notas. Si pierdes los datos, pégalo abajo para recuperar todo.</p><div class="row"><button class="btn2 wa" onclick="bkWa()">Enviar copia por WhatsApp</button><button class="btn2" onclick="bkCopiar()">Copiar copia</button></div><label for="bk">Restaurar: pega aquí el código</label><textarea id="bk" placeholder="ROT1:..."></textarea><div class="err" id="bke"></div><button class="btn" onclick="bkRestaurar()">Restaurar copia</button></div>'+
  instCard()+
  '<div class="card"><b>Compartir la app</b><p class="mu">Manda el enlace por WhatsApp. Cada persona la abre en Chrome y usa sus propias OT, en su teléfono.</p><button class="btn" onclick="appWa()">Enviar app por WhatsApp</button></div>';
 A.innerHTML=A_html;
}
var A_html="";
function soloNum(el){var v=el.value.replace(/\D/g,"");if(v!==el.value)el.value=v}
function editarNombre(){editing=true;pend=null;vista="main";render();window.scrollTo(0,0);var n=document.getElementById("n");if(n)n.focus()}
function cancelarNombre(){editing=false;render()}
function setUser(){
 var n=document.getElementById("n").value.trim(),a=document.getElementById("a").value.trim();
 if(!n||!a){document.getElementById("e").textContent="Completa nombre y apellido.";return}
 S.user={n:n,a:a};editing=false;save();render();
}
function tipoUI(){
 if(addingTipo)return '<div class="row"><input id="nt" placeholder="Nombre del nuevo tipo" autocomplete="off"><button class="btn2" style="flex:none;width:auto" onclick="guardarTipo()">Agregar</button><button class="btn2" style="flex:none;width:auto" aria-label="Cancelar" onclick="toggleTipo(false)">✕</button></div>';
 var x=S.extra.map(function(t){return'<span class="chip">'+esc(t)+' <button class="x" style="padding:0 0 0 4px" aria-label="Quitar tipo" data-t="'+esc(t)+'" onclick="quitarTipo(this.dataset.t)">✕</button></span>'}).join("");
 return '<button class="lnk" onclick="toggleTipo(true)">+ Agregar tipo</button>'+(x?'<div class="chips" style="margin-top:2px">'+x+'</div>':'');
}
function toggleTipo(on){
 var o=document.getElementById("ot");if(o)otTmp=o.value;
 addingTipo=on;render();
 if(on){var i=document.getElementById("nt");if(i)i.focus()}
}
function guardarTipo(){
 var v=document.getElementById("nt").value.trim();
 if(!v){toast("Escribe el nombre del tipo");return}
 if(TIPOS.some(function(t){return t.toLowerCase()===v.toLowerCase()})){toast("Ese tipo ya existe");return}
 TIPOS.push(v);S.extra.push(v);lastTipo=v;addingTipo=false;save();render();toast("Tipo agregado");
}
function quitarTipo(t){
 if(S.regs.some(function(r){return r.tipo===t})){toast("Hay OT con ese tipo; no se puede quitar");return}
 var o=document.getElementById("ot");if(o)otTmp=o.value;
 S.extra=S.extra.filter(function(x){return x!==t});
 TIPOS.splice(TIPOS.indexOf(t),1);
 if(lastTipo===t)lastTipo=TIPOS[0];
 save();render();
}
function add(){
 var ot=document.getElementById("ot").value.replace(/\D/g,"");
 lastTipo=document.getElementById("tipo").value;
 if(!ot){err="Escribe el número de OT (solo números).";render();return}
 otTmp="";err="";S.regs.push({id:Date.now(),ot:ot,tipo:lastTipo,fecha:hoy()});
 if(hoy().slice(0,7)!==mes)mes=hoy().slice(0,7);
 save();render();toast("OT guardada");
}
function borrar(id){
 if(pend===id){S.regs=S.regs.filter(function(r){return r.id!==id});pend=null;save()}else{pend=id}
 render();
}
function cm(d){var p=mes.split("-"),x=new Date(+p[0],+p[1]-1+d,1);mes=x.getFullYear()+"-"+pad(x.getMonth()+1);pend=null;render()}
function resumen(){
 var rs=S.regs.filter(function(r){return r.fecha.indexOf(mes)===0}).sort(function(a,b){return a.id-b.id});
 var cnt={};rs.forEach(function(r){cnt[r.tipo]=(cnt[r.tipo]||0)+1});
 var t="Registro de OT - "+mesLabel(mes)+"\n"+S.user.n+" "+S.user.a+"\nTotal: "+rs.length+"\n";
 TIPOS.forEach(function(k){if(cnt[k])t+="\n"+k+": "+cnt[k]});
 if(rs.length){t+="\n\nDetalle:";rs.forEach(function(r){t+="\n"+fdia(r.fecha)+" - OT "+r.ot+" - "+r.tipo})}
 return t;
}
function wa(){
 var t=resumen(),w=null;
 try{w=window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}catch(e){}
 if(!w&&navigator.share){navigator.share({text:t}).catch(function(){})}
 else if(!w){copiar()}
}
function copiar(){
 var t=resumen();
 try{navigator.clipboard.writeText(t).then(function(){toast("Resumen copiado")},function(){toast("No se pudo copiar")})}catch(e){toast("No se pudo copiar")}
}
var vista="main",hf="";
function irHist(){vista="hist";pend=null;render();window.scrollTo(0,0)}
function irMain(){vista="main";pend=null;render();window.scrollTo(0,0)}
function fcompleta(f){var p=f.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function filtroRegs(){
 return S.regs.filter(function(r){return !hf||r.tipo===hf}).sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.id-a.id});
}
function renderHist(){
 var A=document.getElementById("app"),cnt={};
 S.regs.forEach(function(r){cnt[r.tipo]=(cnt[r.tipo]||0)+1});
 var opts='<option value="">Todos los tipos ('+S.regs.length+')</option>'+TIPOS.map(function(t){return'<option value="'+esc(t)+'"'+(t===hf?" selected":"")+'>'+esc(t)+' ('+(cnt[t]||0)+')</option>'}).join("");
 var rs=filtroRegs(),cm={};
 rs.forEach(function(r){var m=r.fecha.slice(0,7);cm[m]=(cm[m]||0)+1});
 var g="",out="";
 rs.forEach(function(r){
  var m=r.fecha.slice(0,7);
  if(m!==g){g=m;out+='<div class="mu" style="margin-top:14px"><b>'+esc(cap(mesLabel(m)))+' · '+cm[m]+' OT</b></div>'}
  out+='<div class="it"><span class="o">'+esc(r.ot)+'</span><span class="t">'+esc(r.tipo)+' · '+esc(fcompleta(r.fecha))+'</span><button class="x'+(pend===r.id?" p":"")+'" onclick="borrar('+r.id+')">'+(pend===r.id?"¿Seguro?":"Borrar")+'</button></div>';
 });
 if(!rs.length)out='<div class="vacio">No hay OT'+(hf?" de este tipo":"")+' todavía.</div>';
 A.innerHTML='<div class="top"><div><h1>Historial por tipo</h1><p class="mu">'+esc(S.user.n+" "+S.user.a)+'</p></div><button class="lnk" onclick="irMain()">‹ Volver</button></div>'+
  '<div class="card"><label for="hf">Tipo</label><select id="hf" onchange="hf=this.value;pend=null;render()">'+opts+'</select><div class="tot" style="margin-top:14px">'+rs.length+'</div><p class="mu">OT '+(hf?"de "+esc(hf):"en total")+'</p><div class="row"><button class="btn2" onclick="pdfHist()">Descargar PDF</button></div></div>'+
  '<div class="card">'+out+'</div>';
}
function mkPdf(nombre,L){
 var J=window.jspdf;
 if(!J){toast("El PDF no está disponible ahora. Revisa tu conexión.");return}
 var d=new J.jsPDF({unit:"mm",format:"a4"}),y=20,X=[15,45,100];
 L.forEach(function(l){
  d.setFont("helvetica",l.b?"bold":"normal");d.setFontSize(l.s||11);
  y+=l.gap||0;
  if(y>278){d.addPage();y=20}
  if(l.c){l.c.forEach(function(x,i){d.text(String(x),X[i],y)})}else{d.text(String(l.t),15,y)}
  y+=(l.s||11)*0.5+1.5;
 });
 var np=d.getNumberOfPages();
 for(var i=1;i<=np;i++){d.setPage(i);d.setFont("helvetica","normal");d.setFontSize(8);d.text("Editor: Boris Casanueva Muñoz",105,290,{align:"center"})}
 guardarPdf(nombre,d.output("blob"));
}
async function guardarPdf(nombre,blob){
 try{
  var dl=null;
  try{dl=window.claude&&await window.claude.use("downloads")}catch(e){}
  if(dl){await dl.save({filename:nombre,data:blob});toast("PDF guardado");return}
  var f=new File([blob],nombre,{type:"application/pdf"});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nombre});return}
  var u=URL.createObjectURL(blob),w=window.open(u,"_blank");
  if(!w)toast("Tu teléfono bloqueó el PDF");
 }catch(e){if(!e||(e.code!=="declined"&&e.name!=="AbortError"))toast("No se pudo guardar el PDF")}
}
function pdfMes(){
 var rs=S.regs.filter(function(r){return r.fecha.indexOf(mes)===0}).sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.id-b.id});
 var cnt={};rs.forEach(function(r){cnt[r.tipo]=(cnt[r.tipo]||0)+1});
 var L=[{t:"Registro de OT - "+cap(mesLabel(mes)),s:16,b:1},{t:S.user.n+" "+S.user.a,s:11,gap:2},{t:"Total: "+rs.length,s:12,b:1,gap:4}];
 TIPOS.forEach(function(k){if(cnt[k])L.push({t:k+": "+cnt[k],s:11})});
 if(rs.length){
  L.push({t:"Detalle",s:13,b:1,gap:6});
  L.push({c:["Fecha","OT","Tipo"],b:1,s:10,gap:2});
  rs.forEach(function(r){L.push({c:[fcompleta(r.fecha),r.ot,r.tipo],s:10})});
 }
 mkPdf("RegistroOT_"+mes+".pdf",L);
}
function pdfHist(){
 var rs=filtroRegs();
 var L=[{t:"Historial de OT"+(hf?" - "+hf:""),s:16,b:1},{t:S.user.n+" "+S.user.a,s:11,gap:2},{t:"Total: "+rs.length+" OT",s:12,b:1,gap:4}];
 var g="",cm={};
 rs.forEach(function(r){var m=r.fecha.slice(0,7);cm[m]=(cm[m]||0)+1});
 rs.forEach(function(r){
  var m=r.fecha.slice(0,7);
  if(m!==g){g=m;L.push({t:cap(mesLabel(m))+" - "+cm[m]+" OT",s:12,b:1,gap:6});L.push({c:["Fecha","OT","Tipo"],b:1,s:10,gap:2})}
  L.push({c:[fcompleta(r.fecha),r.ot,r.tipo],s:10});
 });
 mkPdf("HistorialOT_"+(hf?hf.replace(/[^A-Za-z0-9]+/g,"_"):"todos")+".pdf",L);
}
var dip=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();dip=e});
window.addEventListener("appinstalled",function(){dip=null;toast("App instalada");render()});
function esApp(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true}
function instCard(){
 if(esApp())return "";
 var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
 return '<div class="card"><b>Instalar en este teléfono</b><p class="mu">'+(ios?"En iPhone: toca el botón Compartir y luego Agregar a inicio.":"Descarga la app con su ícono para abrirla como cualquier otra app.")+'</p>'+(ios?'':'<button class="btn" onclick="instalar()">Instalar app</button>')+'</div>';
}
function instalar(){
 if(!dip){toast("Toca ⋮ en Chrome y elige Instalar app");return}
 dip.prompt();dip.userChoice.then(function(){dip=null;render()});
}
function appWa(){
 var t="Registro de OT: abre este enlace en Chrome y, para instalarla, toca los 3 puntos y elige 'Agregar a pantalla de inicio'.\n"+location.href.split("#")[0].split("?")[0],w=null;
 try{w=window.open("https://wa.me/?text="+encodeURIComponent(t),"_blank")}catch(e){}
 if(!w&&navigator.share){navigator.share({text:t}).catch(function(){})}
 else if(!w){try{navigator.clipboard.writeText(t).then(function(){toast("Enlace copiado")})}catch(e){toast("No se pudo copiar")}}
}
function bkCodigo(){
 var j=JSON.stringify({user:S.user,regs:S.regs,extra:S.extra});
 return "ROT1:"+btoa(unescape(encodeURIComponent(j)));
}
function bkMarcar(){S.bk=hoy();save();render()}
function bkCopiar(){
 var c=bkCodigo();
 try{navigator.clipboard.writeText(c).then(function(){bkMarcar();toast("Copia copiada")},function(){toast("No se pudo copiar")})}catch(e){toast("No se pudo copiar")}
}
function bkWa(){
 var c="Copia de seguridad Registro de OT ("+hoy()+")\n"+bkCodigo(),w=null;
 try{w=window.open("https://wa.me/?text="+encodeURIComponent(c),"_blank")}catch(e){}
 if(!w&&navigator.share){navigator.share({text:c}).catch(function(){})}
 else if(!w){bkCopiar();return}
 bkMarcar();
}
function bkRestaurar(){
 var e=document.getElementById("bke"),t=document.getElementById("bk").value;
 var i=t.indexOf("ROT1:");
 if(i<0){e.textContent="No encuentro un código válido (empieza con ROT1:).";return}
 try{
  var b=t.slice(i+5).match(/[A-Za-z0-9+\/=]+/)[0];
  var d=JSON.parse(decodeURIComponent(escape(atob(b))));
  if(!d||!Array.isArray(d.regs))throw 0;
  var ids={};S.regs.forEach(function(r){ids[r.id]=1});
  var n=0;
  function addT(t){if(typeof t==="string"&&t&&TIPOS.indexOf(t)<0){TIPOS.push(t);S.extra.push(t)}}
  (d.extra||[]).forEach(addT);d.regs.forEach(function(r){if(r)addT(r.tipo)});
  d.regs.forEach(function(r){if(r&&r.id&&r.ot&&r.tipo&&r.fecha&&!ids[r.id]){S.regs.push(r);n++}});
  if(!S.user&&d.user)S.user=d.user;
  save();render();toast(n+" OT recuperadas");
 }catch(x){e.textContent="El código está incompleto o dañado. Cópialo de nuevo completo."}
}
function toast(m){var d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}
render();
